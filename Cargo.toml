[package]
name = "tuemensa"
categories = ["command-line-utilities"]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["structix"]
description = "A simple command-line tool designed to retrieve the current meal plans for the canteens at Eberhard Karls Universität Tübingen."
repository = "https://github.com/STRUCTiX/tuemensa"
readme = "README.md"
keywords = ["cli", "canteen", "university", "tuebingen"]

exclude = ["screenshots"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.39"
clap = { version = "4.5.23", features = ["derive"] }
prettytable = "0.10.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_derive = "1.0.217"
anyhow = "=1.0.95"

[dependencies.ureq]
version = "*"
features = ["default", "json", "tls"]
optional = true

[dependencies.reqwest]
version = "0.12.11"
features = ["blocking", "json", "rustls-tls"]
default-features = false
optional = true

[lib]
name = "tuemensa_lib"
path = "src/lib.rs"

[[bin]]
name = "tuemensa"
path = "src/main.rs"

[features]
default = ["android"]
android = ["reqwest"]
small = []
